name: Update podcast RSS

on:
  schedule:
    # 02:00 UTC = 11:00 KST
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check for new episodes
        run: python update_rss.py

      - name: Commit RSS changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- imakara_nihongo_rss.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No RSS changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add imakara_nihongo_rss.xml
            git commit -m "Update podcast RSS"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Pages files
        run: |
          mkdir -p public
          cp imakara_nihongo_rss.xml public/
          cp imakara_nihongo_cover.jpg public/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
